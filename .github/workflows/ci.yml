name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the dogfood review diffs via `git merge-base` —
          # the default depth-1 checkout has no ancestry, so merge-base
          # would fail (or graft wrong) on every PR.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Boundary check
        run: pnpm run check:boundaries

      - name: Build
        run: pnpm -r build

      # Clean checkouts do not have workspace package declarations yet;
      # build them before the root solution typecheck resolves package exports.
      - name: Typecheck
        run: pnpm run typecheck

      # Story 1.18 dogfood (M1 gate): review this PR's own diff with the tool
      # itself — direct CLI invocation, deterministic-only, no packaged
      # Action. Blocking findings fail the check via the CLI's own nonzero
      # exit; NFR-1's <60s envelope is asserted in-step. The base ref lives
      # in the checked-out BASE repository (fork PRs included — `origin` is
      # always the base repo here), so an unfetchable base is a loud, named
      # failure, never a silent skip.
      - name: Dogfood review (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          if ! git fetch origin "$GITHUB_BASE_REF"; then
            echo "dogfood review: failed to fetch base ref origin/$GITHUB_BASE_REF from the base repository" >&2
            exit 1
          fi
          SECONDS=0
          status=0
          node packages/cli/dist/index.js review --branch HEAD --base "origin/$GITHUB_BASE_REF" --no-input || status=$?
          duration=$SECONDS
          echo "dogfood review wall-clock: ${duration}s"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$duration" -ge 60 ]; then
            echo "dogfood review took ${duration}s — NFR-1 requires <60s" >&2
            exit 1
          fi

      # Upload-not-commit is the configured policy: `--no-input` disposition
      # is `drop`, which leaves the run artifact untracked on disk. Uploaded
      # even when the review failed — a failing review's artifact is the one
      # you want to read.
      - name: Upload dogfood review artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dogfood-review
          path: _agentic-guardrails/reviews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test (per-package, AC-1 oracle)
        run: pnpm -r test

      - name: Test (tooling self-guard tests — unit tests already ran per-package)
        run: pnpm test -- --project tooling --project integration
